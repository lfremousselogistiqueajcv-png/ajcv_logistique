<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#181C23">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AJCV Flotte">
<link rel="manifest" href="data:application/json,%7B%22name%22%3A%22AJCV%20Flotte%22%2C%22short_name%22%3A%22AJCV%20Flotte%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23181C23%22%2C%22theme_color%22%3A%22%23181C23%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22logo-192.png%22%2C%22sizes%22%3A%22192x192%22%2C%22type%22%3A%22image%2Fpng%22%7D%2C%7B%22src%22%3A%22logo-512.png%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%2Fpng%22%7D%2C%7B%22src%22%3A%22logo-512.png%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%2Fpng%22%2C%22purpose%22%3A%22maskable%22%7D%5D%7D">
<link rel="icon" href="logo-32.png" type="image/png">
<link rel="apple-touch-icon" href="logo-192.png">
<title>AJCV Flotte</title>
<style>
:root {
  --navy:#181C23; --navy2:#20252E; --gold:#E8A63C; --gold2:#F0BE6E;
  --dark:#12151B; --surface:#181C23; --surface2:#20252E;
  --green:#33C481; --red:#F0555A; --blue:#4E8BF0; --orange:#E39A3D; --purple:#8B6CF2;
  --text:#EDEEF1; --text2:#9BA1AC; --text3:#6E7480;
  --border:rgba(255,255,255,0.08);
  --r:14px; --rs:8px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--dark);color:var(--text);min-height:100vh;overflow-x:hidden}
button,input,select,textarea{font-family:inherit}

/* ── LOGIN ─────────────────────────────────────── */
#login{display:none;min-height:100vh;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:var(--dark)}
#login.active{display:flex}
.login-logo{margin-bottom:22px;text-align:center}
.login-logo img{width:64px;height:64px;border-radius:50%;object-fit:cover;margin-bottom:10px}
.login-logo .t{font-size:22px;font-weight:800;letter-spacing:.5px;color:var(--text)}
.login-logo .s{font-size:13px;color:var(--gold);margin-top:4px;letter-spacing:2px;font-weight:600}
.login-title{font-size:20px;font-weight:700;color:var(--text);margin-bottom:4px}
.login-sub{font-size:13px;color:var(--text2);margin-bottom:28px;text-align:center}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:24px;width:100%;max-width:340px}
.login-label{font-size:12px;color:var(--text2);font-weight:600;text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px;display:block}
.field{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--rs);padding:12px 14px;color:var(--text);font-size:15px;margin-bottom:14px}
.field:focus{outline:none;border-color:var(--gold)}
.btn{width:100%;padding:14px;border:none;border-radius:var(--rs);font-size:15px;font-weight:700;cursor:pointer;transition:all .15s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.4;pointer-events:none}
.btn-gold{background:var(--gold);color:var(--navy)}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-red{background:var(--red);color:#fff}
.btn-green{background:var(--green);color:#0b2b1c}
.err-box{color:var(--red);font-size:13px;margin-bottom:14px;display:none}

/* ── APP ───────────────────────────────────────── */
#app{display:none;min-height:100vh;flex-direction:column;padding-bottom:70px}
#app.on{display:flex}
header{position:sticky;top:0;z-index:20;background:var(--navy);border-bottom:2px solid var(--gold);padding:12px 16px;display:flex;align-items:center;gap:10px}
header .av{width:36px;height:36px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--navy);flex:none}
header .who{flex:1;min-width:0}
header .who b{display:block;font-size:14px}
header .who span{font-size:11px;color:var(--text2)}
header .verbadge{font-size:11px;color:var(--text2);cursor:pointer;border:1px solid var(--border);border-radius:999px;padding:3px 8px;background:none}
header button.iconbtn{background:rgba(255,255,255,.08);border:none;border-radius:var(--rs);color:var(--text);font-size:15px;cursor:pointer;padding:8px 10px}
main{flex:1;padding:16px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px}
.card h2{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.muted{color:var(--text2);font-size:12.5px}
label.lbl{font-size:12px;color:var(--text2);font-weight:600;margin:10px 0 6px;display:block}
label.lbl:first-child{margin-top:0}
.veh-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px;max-height:340px;overflow-y:auto;padding:2px 2px 4px}
.veh-opt{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;aspect-ratio:1;padding:12px 8px;border:2px solid var(--border);border-radius:var(--r);cursor:pointer;background:var(--surface2);text-align:center;transition:transform .12s,border-color .12s}
.veh-opt:active{transform:scale(.96)}
.veh-opt .ico{font-size:28px;line-height:1}
.veh-opt.sel{border-color:var(--gold);background:rgba(232,166,60,.08)}
.veh-opt.dispo-non{opacity:.45;pointer-events:none}
.veh-opt .plaque{font-weight:700;font-size:13.5px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.veh-opt .desc{font-size:10.5px;color:var(--text2);line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.veh-opt .badge{font-size:9px;font-weight:700;padding:2px 7px;border-radius:20px;background:rgba(240,85,90,.15);color:var(--red);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.type-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:4px}
.type-opt{padding:10px 4px;text-align:center;border:2px solid var(--border);border-radius:var(--rs);cursor:pointer;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2)}
.type-opt.sel-pro{border-color:var(--green);color:var(--green);background:rgba(51,196,129,.1)}
.type-opt.sel-mixte{border-color:var(--orange);color:var(--orange);background:rgba(227,154,61,.1)}
.type-opt.sel-perso{border-color:var(--red);color:var(--red);background:rgba(240,85,90,.1)}
.kpi-row{display:flex;gap:10px}
.kpi{flex:1;background:var(--surface2);border-radius:var(--rs);padding:10px;text-align:center}
.kpi b{display:block;font-size:18px}
.kpi span{font-size:10.5px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px}
.chip-cours{background:rgba(78,139,240,.15);color:var(--blue)}
.chip-cloturee{background:rgba(51,196,129,.15);color:var(--green)}
.chip-anomalie{background:rgba(240,85,90,.15);color:var(--red)}
.hist-item{padding:12px 0;border-bottom:1px solid var(--border)}
.hist-item:last-child{border-bottom:none}
.hist-item .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.photo-btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;border:2px dashed var(--border);border-radius:var(--rs);cursor:pointer;color:var(--text2);font-size:13px;font-weight:600}
.photo-btn.has{border-style:solid;border-color:var(--green);color:var(--green)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy2);color:var(--text);padding:12px 18px;border-radius:10px;font-size:13px;font-weight:600;z-index:9999;box-shadow:0 6px 20px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .25s;max-width:88vw;text-align:center}
.toast.show{opacity:1}
.toast.error{background:var(--red);color:#fff}
.toast.success{background:var(--green);color:#0b2b1c}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--navy);border-top:1px solid var(--border);display:flex;z-index:20}
nav.tabs button{flex:1;background:none;border:none;color:var(--text2);padding:10px 4px 8px;font-size:11px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button.on{color:var(--gold)}
nav.tabs button .ic{font-size:19px}

/* ── MODALE ────────────────────────────────────── */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;align-items:flex-end;justify-content:center}
.modal-bg.on{display:flex}
.modal-sheet{background:var(--navy);border-radius:18px 18px 0 0;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.modal-sheet h3{font-size:16px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.modal-sheet h3 button{background:none;border:none;color:var(--text2);font-size:20px;cursor:pointer}
textarea.field{resize:vertical;min-height:64px}
.check-row{display:flex;align-items:center;gap:8px;margin:10px 0;font-size:13px;color:var(--text2)}

/* MODE CLAIR (accessibilité — cohérent avec les autres applis AJCV) */
html[data-theme="light"]{
  --dark:#F4F5F7; --surface:#FFFFFF; --surface2:#EDEEF2; --surface3:#E3E5EA;
  --navy:#EDEEF2; --navy2:#E3E5EA; --gold:#0B6B57; --gold2:#0E8069;
  --text:#1B1F27; --text2:#666B76; --text3:#8A8F99;
  --border:rgba(15,23,42,0.10);
}
#theme-btn{position:fixed;bottom:20px;left:20px;z-index:10001;width:46px;height:46px;border-radius:50%;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:21px;box-shadow:0 4px 16px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;cursor:pointer}
#theme-btn:active{transform:scale(.94)}
</style>
<script>try{var _t=localStorage.getItem('ajcv_theme')||((window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark');document.documentElement.setAttribute('data-theme',_t);}catch(e){}</script>
</head>
<body>
<button id="theme-btn" title="Mode clair / sombre (accessibilité)" aria-label="Basculer le mode clair ou sombre">☀️</button>

<div id="login" class="active">
  <div class="login-logo"><img src="logo-512.png" alt="AJCV"><div class="t">AJCV</div><div class="s">FLOTTE</div></div>
  <div class="login-sub">Registre d'utilisation des véhicules<br>et de la carte carburant</div>
  <div class="login-card">
    <label class="login-label">Identifiant</label>
    <input class="field" id="loginInput" autocapitalize="off" autocomplete="username" placeholder="Ton identifiant">
    <label class="login-label">Mot de passe</label>
    <input class="field" id="mdpInput" type="password" autocomplete="current-password" placeholder="••••••••">
    <div class="err-box" id="loginError"></div>
    <button class="btn btn-gold" id="btnLogin" onclick="connexion()">Se connecter</button>
  </div>
</div>

<div id="app">
  <header>
    <div class="av" id="hAvatar">–</div>
    <div class="who"><b id="hNom">–</b><span>AJCV Flotte</span></div>
    <span class="verbadge" id="verBadge" onclick="ouvrirNouveautes()" title="Nouveautés">v…</span>
    <button class="iconbtn" onclick="rafraichir()" title="Rafraîchir">🔄</button>
    <button class="iconbtn" onclick="deconnexion()" title="Déconnexion">⏻</button>
  </header>
  <main id="main"></main>
  <nav class="tabs">
    <button id="tabAccueil" class="on" onclick="allerOnglet('accueil')"><span class="ic">🚗</span>Mon véhicule</button>
    <button id="tabHisto" onclick="allerOnglet('histo')"><span class="ic">📜</span>Historique</button>
  </nav>
</div>

<div class="modal-bg" id="modalPlein">
  <div class="modal-sheet">
    <h3>⛽ Déclarer un plein <button onclick="fermerModal('modalPlein')">✕</button></h3>
    <label class="lbl">Station</label>
    <input class="field" id="pStation" placeholder="Ex: Total Saint-Denis">
    <label class="lbl">Montant (€) *</label>
    <input class="field" id="pMontant" type="number" step="0.01" min="0" inputmode="decimal" placeholder="0.00">
    <label class="lbl">Litres (optionnel)</label>
    <input class="field" id="pLitres" type="number" step="0.01" min="0" inputmode="decimal" placeholder="0.00">
    <label class="lbl">Kilométrage au compteur (optionnel)</label>
    <input class="field" id="pKm" type="number" min="0" inputmode="numeric" placeholder="Ex: 45210">
    <label class="lbl">Carte carburant utilisée</label>
    <select class="field" id="pCarte"><option value="">— Non renseignée —</option></select>
    <label class="lbl">Photo du ticket *</label>
    <label class="photo-btn" id="pPhotoBtn">📷 Prendre une photo du ticket
      <input type="file" accept="image/*" capture="environment" hidden onchange="photoTicketChoisie(this)">
    </label>
    <div class="check-row">
      <input type="checkbox" id="pException" onchange="toggleException()">
      <label for="pException">Ticket perdu / illisible (exception à justifier)</label>
    </div>
    <div id="pExceptionBox" style="display:none">
      <label class="lbl">Justification (obligatoire)</label>
      <textarea class="field" id="pJustifException" placeholder="Explique pourquoi il n'y a pas de photo…"></textarea>
    </div>
    <button class="btn btn-gold" id="btnPlein" onclick="envoyerPlein()" style="margin-top:6px">Enregistrer le plein</button>
  </div>
</div>

<div class="modal-bg" id="modalRetour">
  <div class="modal-sheet">
    <h3>🏁 Retour du véhicule <button onclick="fermerModal('modalRetour')">✕</button></h3>
    <p class="muted" style="margin-bottom:12px">Départ : <b id="rKmDepartTxt">–</b> km</p>
    <label class="lbl">Kilométrage au retour *</label>
    <input class="field" id="rKmRetour" type="number" inputmode="numeric" placeholder="Ex: 45260">
    <label class="lbl">Commentaire (si dommage, incident, anomalie)</label>
    <textarea class="field" id="rCommentaire" placeholder="Laisse vide si tout est normal"></textarea>
    <button class="btn btn-green" id="btnRetour" onclick="envoyerRetour()">Valider le retour</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<a href="index.html" title="Menu AJCV" style="position:fixed;bottom:16px;right:16px;z-index:9999;width:44px;height:44px;border-radius:50%;background:rgba(30,41,66,.88);border:1px solid rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:20px;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.35);backdrop-filter:blur(6px)">🏠</a>

<div id="nouveautesModal" style="display:none;position:fixed;inset:0;z-index:9600;background:rgba(0,0,0,.6);align-items:flex-end;justify-content:center" onclick="if(event.target===this)fermerNouveautes()">
  <div style="background:var(--surface);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px 18px 28px;max-height:80vh;overflow:auto">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <div style="font-size:17px;font-weight:700;color:var(--text)">✨ Nouveautés</div>
      <button onclick="fermerNouveautes()" style="background:var(--surface2);border:none;color:var(--text);border-radius:8px;padding:6px 12px;font-size:14px;cursor:pointer">Fermer</button>
    </div>
    <div id="nouveautesCorps"></div>
  </div>
</div>

<script>
// ── CONFIG (seule différence test/prod — cf. scripts/build.js) ─────────────
const CFG = { API_URL: 'https://ajcvbackend-production.up.railway.app' };
const state = { token:'', login:'', prenom:'', role:'', tokenExpiry:0, vehicules:[], utilisationActive:null, vehiculeChoisi:null, typeTrajet:'professionnel', photoTicketB64:null, historique:[], onglet:'accueil' };

function showToast(msg, type){
  const t=document.getElementById('toast'); t.textContent=msg; t.className='toast show'+(type?' '+type:'');
  clearTimeout(window._toastTO); window._toastTO=setTimeout(()=>t.classList.remove('show'),3200);
}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// ── AUTH ─────────────────────────────────────────────────────────────────
async function connexion(){
  const login=document.getElementById('loginInput').value.trim();
  const mdp=document.getElementById('mdpInput').value.trim();
  const btn=document.getElementById('btnLogin'), err=document.getElementById('loginError');
  if(!login||!mdp){ err.textContent='Identifiant et mot de passe requis'; err.style.display='block'; return; }
  btn.disabled=true; btn.textContent='Connexion…'; err.style.display='none';
  try{
    const resp=await fetch(`${CFG.API_URL}/auth/login`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({login,mdp,app:'flotte'})});
    const data=await resp.json();
    if(data.error){ err.textContent='❌ '+data.error; err.style.display='block'; btn.disabled=false; btn.textContent='Se connecter'; return; }
    state.token=data.token; state.prenom=data.prenom; state.role=data.role; state.login=login;
    state.tokenExpiry=Date.now()+((data.expiresIn||480)*60*1000);
    try{ localStorage.setItem('ajcvflotte_session', JSON.stringify({token:state.token,tokenExpiry:state.tokenExpiry,prenom:state.prenom,role:state.role,login})); }catch(_){}
    lancerApp();
  }catch(e){ err.textContent='❌ Erreur de connexion. Vérifie ton réseau.'; err.style.display='block'; btn.disabled=false; btn.textContent='Se connecter'; }
}
function restoreSession(){
  try{
    const s=JSON.parse(localStorage.getItem('ajcvflotte_session')||'null');
    if(s&&s.token&&s.tokenExpiry>Date.now()){ Object.assign(state,s); lancerApp(); return true; }
  }catch(_){}
  return false;
}
function deconnexion(){
  try{ localStorage.removeItem('ajcvflotte_session'); }catch(_){}
  location.reload();
}
function api(method, path, body){
  const opts={ method, headers:{'Authorization':'Bearer '+state.token} };
  if(body){ opts.headers['Content-Type']='application/json'; opts.body=JSON.stringify(body); }
  return fetch(`${CFG.API_URL}${path}`, opts).then(r=>r.json());
}

async function lancerApp(){
  document.getElementById('login').classList.remove('active');
  document.getElementById('app').classList.add('on');
  document.getElementById('hNom').textContent=state.prenom||state.login;
  document.getElementById('hAvatar').textContent=(state.prenom||state.login||'?').charAt(0).toUpperCase();
  await rafraichir();
}
async function rafraichir(){
  const [va, ua] = await Promise.all([ api('GET','/flotte/vehicules'), api('GET','/flotte/mon-utilisation-active') ]);
  if(va && va.error){ showToast('❌ '+va.error,'error'); }
  state.vehicules = (va && va.vehicules) || [];
  state.utilisationActive = (ua && ua.utilisation) || null;
  render();
}

// ── NAVIGATION ONGLETS ───────────────────────────────────────────────────
async function allerOnglet(nom){
  state.onglet=nom;
  document.getElementById('tabAccueil').classList.toggle('on', nom==='accueil');
  document.getElementById('tabHisto').classList.toggle('on', nom==='histo');
  if(nom==='histo'){
    const h=await api('GET','/flotte/mes-utilisations');
    state.historique=(h&&h.utilisations)||[];
  }
  render();
}

// ── RENDU ────────────────────────────────────────────────────────────────
function render(){
  document.getElementById('main').innerHTML = state.onglet==='histo' ? renderHisto() : renderAccueil();
}

function renderAccueil(){
  if(state.utilisationActive) return renderEnCours(state.utilisationActive);
  return renderPrise();
}

function renderPrise(){
  const options = state.vehicules.map(v=>{
    const label = [v.marque,v.modele].filter(Boolean).join(' ') || v.description || '';
    return `<div class="veh-opt ${state.vehiculeChoisi===v.id?'sel':''} ${v.disponible?'':'dispo-non'}" onclick="${v.disponible?`choisirVehicule(${v.id})`:''}">
      <div class="ico">🚐</div>
      <div class="plaque">${esc(v.plaque)}</div>
      ${label?`<div class="desc">${esc(label)}</div>`:''}
      ${!v.disponible?`<span class="badge">👤 ${esc(v.pris_par||'?')}</span>`:''}
    </div>`;
  }).join('') || '<p class="muted">Aucun véhicule actif enregistré.</p>';

  return `
  <div class="card">
    <h2>🚗 Prendre un véhicule</h2>
    <label class="lbl">Véhicule</label>
    <div class="veh-list">${options}</div>

    <label class="lbl">Kilométrage au départ *</label>
    <input class="field" id="prKm" type="number" inputmode="numeric" placeholder="Ex: 45000">

    <label class="lbl">Motif / destination *</label>
    <input class="field" id="prMotif" placeholder="Ex: livraison Saint-Pierre, RDV client…">

    <label class="lbl">Type de trajet *</label>
    <div class="type-grid">
      <div class="type-opt ${state.typeTrajet==='professionnel'?'sel-pro':''}" onclick="choisirType('professionnel')">Professionnel</div>
      <div class="type-opt ${state.typeTrajet==='mixte'?'sel-mixte':''}" onclick="choisirType('mixte')">Mixte</div>
      <div class="type-opt ${state.typeTrajet==='personnel'?'sel-perso':''}" onclick="choisirType('personnel')">Personnel</div>
    </div>
    <div id="justifPersoBox" style="display:${state.typeTrajet==='personnel'?'block':'none'}">
      <label class="lbl">Justification (obligatoire pour un trajet personnel)</label>
      <textarea class="field" id="prJustif" placeholder="Motif du trajet personnel…"></textarea>
    </div>

    <button class="btn btn-gold" style="margin-top:8px" onclick="envoyerPrise()">Valider la prise du véhicule</button>
  </div>`;
}

function choisirVehicule(id){ state.vehiculeChoisi=id; render(); }
function choisirType(t){ state.typeTrajet=t; render(); }

async function envoyerPrise(){
  const km = document.getElementById('prKm').value;
  const motif = document.getElementById('prMotif').value.trim();
  const justifEl = document.getElementById('prJustif');
  const justification = justifEl ? justifEl.value.trim() : '';
  if(!state.vehiculeChoisi){ showToast('Choisis un véhicule','error'); return; }
  if(!km){ showToast('Kilométrage de départ requis','error'); return; }
  if(!motif){ showToast('Motif requis','error'); return; }
  if(state.typeTrajet==='personnel' && !justification){ showToast('Justification obligatoire pour un trajet personnel','error'); return; }
  const r = await api('POST','/flotte/prise',{ vehicule_id:state.vehiculeChoisi, km_depart:parseInt(km), motif, type_trajet:state.typeTrajet, justification_personnel:justification||undefined });
  if(r.error){ showToast('❌ '+r.error,'error'); return; }
  showToast('✅ Véhicule pris en charge','success');
  state.vehiculeChoisi=null; state.typeTrajet='professionnel';
  await rafraichir();
}

function dureeDepuis(dateISO){
  const ms=Date.now()-new Date(dateISO).getTime();
  const h=Math.floor(ms/3600000), m=Math.floor((ms%3600000)/60000);
  return h>0 ? `${h} h ${m} min` : `${m} min`;
}

function renderEnCours(u){
  const v = u.vehicules || {};
  const label = [v.marque, v.modele].filter(Boolean).join(' ');
  return `
  <div class="card">
    <h2>🚗 Véhicule en cours</h2>
    <div class="kpi-row">
      <div class="kpi"><b>${esc(v.plaque||'?')}</b><span>Plaque</span></div>
      <div class="kpi"><b>${u.km_depart}</b><span>Km départ</span></div>
      <div class="kpi"><b>${dureeDepuis(u.date_depart)}</b><span>Depuis</span></div>
    </div>
    <p class="muted" style="margin-top:12px">${esc(label)} — ${esc(u.motif)}</p>
    <p class="muted">Trajet : <b style="color:var(--text)">${esc(u.type_trajet)}</b></p>
  </div>
  <div class="card">
    <h2>⛽ Carburant</h2>
    <p class="muted" style="margin-bottom:10px">Un plein ? Déclare-le tout de suite, ticket à l'appui.</p>
    <button class="btn btn-outline" onclick="ouvrirModalPlein()">📷 Déclarer un plein</button>
  </div>
  <div class="card">
    <h2>🏁 Fin de trajet</h2>
    <button class="btn btn-green" onclick="ouvrirModalRetour()">Terminer / Rendre le véhicule</button>
  </div>`;
}

function renderHisto(){
  if(!state.historique.length) return '<div class="card"><p class="muted">Aucune utilisation enregistrée.</p></div>';
  const items = state.historique.map(u=>{
    const v=u.vehicules||{};
    const km = (u.km_retour!=null) ? `${u.km_retour - u.km_depart} km parcourus` : `depuis ${u.km_depart} km`;
    const chip = u.statut==='en_cours'?'chip-cours':u.statut==='anomalie'?'chip-anomalie':'chip-cloturee';
    const chipTxt = u.statut==='en_cours'?'En cours':u.statut==='anomalie'?'Anomalie':'Terminé';
    return `<div class="hist-item">
      <div class="top"><b>${esc(v.plaque||'?')}</b><span class="chip ${chip}">${chipTxt}</span></div>
      <div class="muted">${new Date(u.date_depart).toLocaleDateString('fr-FR')} · ${esc(u.motif)} · ${km}</div>
    </div>`;
  }).join('');
  return `<div class="card"><h2>📜 Historique</h2>${items}</div>`;
}

// ── MODALES ──────────────────────────────────────────────────────────────
function fermerModal(id){ document.getElementById(id).classList.remove('on'); }

async function ouvrirModalPlein(){
  document.getElementById('pStation').value='';
  document.getElementById('pMontant').value='';
  document.getElementById('pLitres').value='';
  document.getElementById('pKm').value='';
  document.getElementById('pException').checked=false;
  document.getElementById('pExceptionBox').style.display='none';
  document.getElementById('pJustifException').value='';
  state.photoTicketB64=null;
  document.getElementById('pPhotoBtn').textContent='📷 Prendre une photo du ticket';
  document.getElementById('pPhotoBtn').classList.remove('has');
  const vId = state.utilisationActive ? state.utilisationActive.vehicule_id : null;
  const c = await api('GET','/flotte/cartes'+(vId?`?vehicule_id=${vId}`:''));
  const sel = document.getElementById('pCarte');
  sel.innerHTML = '<option value="">— Non renseignée —</option>' + ((c.cartes||[]).map(x=>`<option value="${x.id}">${esc(x.numero_masque)}</option>`).join(''));
  document.getElementById('modalPlein').classList.add('on');
}
function toggleException(){
  const on = document.getElementById('pException').checked;
  document.getElementById('pExceptionBox').style.display = on ? 'block':'none';
}
async function photoTicketChoisie(input){
  const f = input.files && input.files[0]; if(!f) return;
  try{
    state.photoTicketB64 = await compresserPhoto(f, 1400, 0.7);
    document.getElementById('pPhotoBtn').textContent='✅ Photo prise — toucher pour reprendre';
    document.getElementById('pPhotoBtn').classList.add('has');
  }catch(_){ showToast('❌ Photo illisible','error'); }
}
async function compresserPhoto(file, maxDim, quality){
  try{
    if (window.createImageBitmap){
      let bmp;
      try{ bmp=await createImageBitmap(file,{resizeWidth:maxDim,resizeHeight:maxDim,resizeQuality:'medium'}); }
      catch(_){ bmp=await createImageBitmap(file); }
      let w=bmp.width,h=bmp.height;
      if(w>h&&w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; }
      else if(h>=w&&h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; }
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(bmp,0,0,w,h);
      if(bmp.close) bmp.close();
      return cv.toDataURL('image/jpeg',quality);
    }
  }catch(_){ }
  return new Promise((resolve,reject)=>{
    const fr=new FileReader();
    fr.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width,h=img.height;
        if(w>h&&w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; }
        else if(h>=w&&h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; }
        const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
        cv.getContext('2d').drawImage(img,0,0,w,h);
        resolve(cv.toDataURL('image/jpeg',quality));
      };
      img.onerror=reject; img.src=fr.result;
    };
    fr.onerror=reject; fr.readAsDataURL(file);
  });
}
async function envoyerPlein(){
  const station = document.getElementById('pStation').value.trim();
  const montant = document.getElementById('pMontant').value;
  const litres = document.getElementById('pLitres').value;
  const km = document.getElementById('pKm').value;
  const carte_id = document.getElementById('pCarte').value || undefined;
  const exception = document.getElementById('pException').checked;
  const justif = document.getElementById('pJustifException').value.trim();
  if(!station){ showToast('Station requise','error'); return; }
  if(!montant || parseFloat(montant)<=0){ showToast('Montant requis','error'); return; }
  if(!state.photoTicketB64 && !exception){ showToast('Photo du ticket requise (ou coche l\'exception)','error'); return; }
  if(exception && !justif){ showToast('Justification requise pour l\'exception','error'); return; }
  const btn=document.getElementById('btnPlein'); btn.disabled=true; btn.textContent='Envoi…';
  const r = await api('POST','/flotte/plein', {
    utilisation_id: state.utilisationActive ? state.utilisationActive.id : undefined,
    vehicule_id: state.utilisationActive ? state.utilisationActive.vehicule_id : undefined,
    carte_id, station, montant_eur: montant, litres: litres||undefined, km_au_plein: km||undefined,
    photo: state.photoTicketB64||undefined, exception_sans_photo: exception, exception_justification: exception?justif:undefined,
  });
  btn.disabled=false; btn.textContent='Enregistrer le plein';
  if(r.error){ showToast('❌ '+r.error,'error'); return; }
  showToast('✅ Plein enregistré','success');
  fermerModal('modalPlein');
}

function ouvrirModalRetour(){
  document.getElementById('rKmDepartTxt').textContent = state.utilisationActive ? state.utilisationActive.km_depart : '–';
  document.getElementById('rKmRetour').value='';
  document.getElementById('rCommentaire').value='';
  document.getElementById('modalRetour').classList.add('on');
}
async function envoyerRetour(){
  const km = document.getElementById('rKmRetour').value;
  const commentaire = document.getElementById('rCommentaire').value.trim();
  if(!km){ showToast('Kilométrage de retour requis','error'); return; }
  if(state.utilisationActive && parseInt(km) < state.utilisationActive.km_depart){
    showToast('Le kilométrage de retour ne peut pas être inférieur au départ','error'); return;
  }
  const btn=document.getElementById('btnRetour'); btn.disabled=true; btn.textContent='Envoi…';
  const r = await api('POST','/flotte/retour', { utilisation_id: state.utilisationActive.id, km_retour:parseInt(km), commentaire_retour: commentaire||undefined });
  btn.disabled=false; btn.textContent='Valider le retour';
  if(r.error){ showToast('❌ '+r.error,'error'); return; }
  showToast('✅ Véhicule rendu','success');
  fermerModal('modalRetour');
  await rafraichir();
}

  function ap(t){ document.documentElement.setAttribute('data-theme',t); const b=document.getElementById('theme-btn'); if(b) b.textContent=(t==='light'?'🌙':'☀️'); }
  function tg(){ const c=document.documentElement.getAttribute('data-theme')==='light'?'light':'dark'; const n=c==='light'?'dark':'light'; try{ localStorage.setItem('ajcv_theme',n); }catch(_){} ap(n); }
  ap(document.documentElement.getAttribute('data-theme')||'dark');
  const b=document.getElementById('theme-btn'); if(b) b.onclick=tg;
})();

// ── VERSION / NOUVEAUTÉS ─────────────────────────────────────────────────
let _verInfo = null;
async function verifierVersion(){
  try{
    const r = await fetch('version.json?t='+Date.now(), { cache:'no-store' });
    if(!r.ok) return;
    const info = await r.json();
    if(!info || !info.version) return;
    _verInfo = info;
    const badge = document.getElementById('verBadge'); if(badge) badge.textContent = 'v'+info.version;
  }catch(_){}
}
function ouvrirNouveautes(){
  const wrap = document.getElementById('nouveautesModal'); if(!wrap) return;
  const hist = (_verInfo && _verInfo.historique) || [];
  document.getElementById('nouveautesCorps').innerHTML = hist.length ? hist.map(h=>`
    <div style="margin-bottom:16px">
      <div style="font-weight:700;color:var(--gold);font-size:14px">v${h.v}${h.date?' · '+h.date:''}</div>
      ${h.titre?`<div style="font-weight:600;margin:2px 0 6px;color:var(--text)">${h.titre}</div>`:''}
      <ul style="margin:0;padding-left:18px;font-size:13px;line-height:1.65;color:var(--text2)">${(h.notes||[]).map(n=>`<li>${n}</li>`).join('')}</ul>
    </div>`).join('') : '<div style="opacity:.7">Aucune information.</div>';
  wrap.style.display = 'flex';
}
function fermerNouveautes(){ const w=document.getElementById('nouveautesModal'); if(w) w.style.display='none'; }
verifierVersion();

document.getElementById('mdpInput')?.addEventListener('keydown', e=>{ if(e.key==='Enter') connexion(); });
