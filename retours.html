<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>AJCV — Retours client</title>
<link rel="icon" href="logo-32.png" type="image/png">
<link rel="apple-touch-icon" href="logo-192.png">
<style>
:root{--gold:#E8A63C;--blue:#4E8BF0;--bg:#12151B;--surface:#181C23;--surface2:#20252E;--border:rgba(255,255,255,.08);--text:#EDEEF1;--text2:#9BA1AC;--text3:#6E7480;--green:#33C481;--red:#F0555A;--orange:#E39A3D;--purple:#8B6CF2}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
input,select,button,textarea{font-family:inherit}
a{color:var(--gold)}
/* LOGIN */
#login{display:flex;min-height:100vh;align-items:center;justify-content:center;padding:24px}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:32px;width:100%;max-width:380px}
.login-card h1{font-size:20px;font-weight:700;color:var(--gold);text-align:center;margin-bottom:4px}
.login-card .sub{font-size:13px;color:var(--text2);text-align:center;margin-bottom:24px}
label{font-size:12px;color:var(--text2);font-weight:600;display:block;margin-bottom:6px;margin-top:14px}
input,select,textarea{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:11px 14px;color:var(--text);font-size:14px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
.btn{padding:11px 18px;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer}
.btn-gold{background:var(--gold);color:#0F1724}
.btn-green{background:var(--green);color:#fff}
.btn-red{background:var(--red);color:#fff}
.btn-gray{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.btn-blue{background:var(--blue);color:#fff}
.btn-purple{background:var(--purple);color:#fff}
.btn-full{width:100%;margin-top:18px}
.btn-sm{padding:6px 10px;font-size:12px;border-radius:6px}
.btn:disabled{opacity:.5;pointer-events:none}
.err{display:none;color:var(--red);font-size:13px;margin-top:12px}
/* APP */
#app{display:none}
#app.on{display:flex;height:100vh;overflow:hidden}
.sidebar{width:224px;flex:none;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;transition:width .16s ease;overflow:hidden}
#app.collapsed .sidebar{width:60px}
.side-brand{display:flex;align-items:center;gap:10px;padding:16px 14px;white-space:nowrap;flex:none}
.side-mark{width:28px;height:28px;border-radius:50%;object-fit:cover;flex:none}
.side-name{font-weight:800;font-size:14px;color:var(--text)}
#app.collapsed .side-name{display:none}
.side-nav{flex:1;overflow-y:auto;padding:4px 10px 16px}
.side-group{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text3);padding:14px 8px 6px;white-space:nowrap}
#app.collapsed .side-group{display:none}
.nav-tab{padding:9px 10px;font-size:13px;font-weight:500;color:var(--text2);cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:11px;border-radius:8px;margin-bottom:1px}
.nav-tab.active{color:var(--gold);background:rgba(232,166,60,.12);font-weight:700}
.nav-tab:hover{color:var(--text);background:var(--surface2)}
#app.collapsed .nav-tab{justify-content:center}
#app.collapsed .nav-tab span{display:none}
.main-col{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.topbar2{flex:none;display:flex;align-items:center;gap:12px;padding:9px 16px;border-bottom:1px solid var(--border);background:var(--surface)}
.icon-btn{background:none;border:none;color:var(--text2);font-size:18px;cursor:pointer;padding:5px 9px;border-radius:7px;line-height:1}
.icon-btn:hover{background:var(--surface2);color:var(--text)}
.topbar-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.content-wrap{flex:1;overflow-y:auto;max-width:1300px;margin:0 auto;padding:20px 16px;width:100%}
@media(max-width:720px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:200}
  #app:not(.collapsed) .sidebar{box-shadow:0 0 0 100vw rgba(0,0,0,.45)}
  #app.collapsed .sidebar{width:0;border:none}
}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:16px}
.card h3{font-size:16px;color:var(--gold);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.flex-between{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.muted{color:var(--text2);font-size:12px}
.table-wrap{overflow-x:auto;border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--surface2);padding:10px 12px;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--text2);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:hover td{background:rgba(255,255,255,.02)}
.pill{display:inline-block;font-size:11px;padding:3px 9px;border-radius:10px;white-space:nowrap;font-weight:700}
.pill-ok{background:rgba(51,196,129,.15);color:var(--green)}
.pill-no{background:rgba(240,85,90,.15);color:var(--red)}
.pill-wait{background:rgba(227,154,61,.15);color:var(--orange)}
.pill-info{background:rgba(78,139,240,.15);color:var(--blue)}
.inline-sel{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:4px 6px;color:var(--text);font-size:11px;cursor:pointer}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.form-actions{display:flex;gap:10px;margin-top:18px;justify-content:flex-end;flex-wrap:wrap}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:14px;text-align:center}
.kpi-v{font-size:22px;font-weight:800}
.kpi-l{font-size:11px;color:var(--text2);margin-top:4px}
.subtab{padding:7px 13px;border:1px solid var(--border);border-radius:8px;background:var(--surface2);color:var(--text2);font-size:13px;font-weight:600;cursor:pointer}
.subtab.active{background:var(--gold);color:#1a1a1a;border-color:var(--gold)}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:500;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
.modal-bg.active{display:flex}
.modal{background:var(--surface);border-radius:14px;padding:24px;width:100%;max-width:560px;margin:auto}
.modal h3{font-size:17px;color:var(--gold);margin-bottom:16px}
.loading{text-align:center;padding:40px;color:var(--text2)}
.spin{display:inline-block;width:32px;height:32px;border:3px solid var(--surface2);border-top-color:var(--gold);border-radius:50%;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--gold);border-radius:10px;padding:12px 20px;font-size:14px;z-index:9999;opacity:0;pointer-events:none;transition:.3s;max-width:90%}
.toast.show{opacity:1}
input[type=file]{display:none}
.lbl-file{display:inline-block;padding:9px 14px;border-radius:8px;background:var(--surface2);color:var(--text);border:1px solid var(--border);cursor:pointer;font-weight:700;font-size:13px}
.ligne-art{border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;background:var(--surface2)}
.art-res-item{padding:8px 10px;border:1px solid var(--border);border-radius:8px;margin-bottom:4px;cursor:pointer;background:var(--surface)}
.art-res-item:hover{border-color:var(--gold)}
html[data-theme="light"]{
  --gold:#0B6B57; --bg:#F4F5F7; --surface:#FFFFFF; --surface2:#EDEEF2;
  --text:#1B1F27; --text2:#666B76; --text3:#8A8F99;
  --border:rgba(15,23,42,0.10);
  --green:#1E8E5A; --red:#C0392B; --orange:#B9791F; --blue:#2D6FE0; --purple:#7C3AED;
}
#theme-btn{position:fixed;bottom:20px;left:20px;z-index:10001;width:46px;height:46px;border-radius:50%;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:21px;box-shadow:0 4px 16px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;cursor:pointer}
#theme-btn:active{transform:scale(.94)}
/* Visionneuse photos plein écran */
#lb-overlay{display:none;position:fixed;inset:0;z-index:100000;background:rgba(0,0,0,.93);align-items:center;justify-content:center}
#lb-overlay.open{display:flex}
#lb-img{max-width:92vw;max-height:86vh;object-fit:contain;border-radius:8px;box-shadow:0 8px 40px rgba(0,0,0,.6)}
#lb-close{position:fixed;top:14px;right:18px;color:#fff;font-size:30px;cursor:pointer;width:48px;height:48px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(255,255,255,.14)}
.lb-nav{position:fixed;top:50%;transform:translateY(-50%);color:#fff;font-size:40px;cursor:pointer;width:52px;height:78px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.10);border-radius:10px}
#lb-prev{left:12px}#lb-next{right:12px}
#lb-count{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);color:#fff;font:600 14px -apple-system,sans-serif;background:rgba(0,0,0,.5);padding:6px 14px;border-radius:20px}
</style>
</head>
<body>
<button id="theme-btn" title="Mode clair / sombre">☀️</button>

<div id="login">
  <div class="login-card">
    <h1>↩️ Retours client</h1>
    <div class="sub">AJCV SARL — La Réunion</div>
    <label>Identifiant</label>
    <input id="lg-user" placeholder="Identifiant" autocomplete="username">
    <label>Mot de passe</label>
    <input id="lg-pass" type="password" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')seConnecter()">
    <div class="err" id="lg-msg"></div>
    <button class="btn btn-gold btn-full" onclick="seConnecter()">Se connecter</button>
  </div>
</div>

<div id="app">
  <aside class="sidebar">
    <div class="side-brand"><img class="side-mark" src="logo-192.png" alt="AJCV"><span class="side-name">Retours</span></div>
    <nav class="side-nav">
      <div class="nav-tab active" data-tab="accueil" onclick="go('accueil')">🏠<span>Accueil</span></div>
      <div class="side-group">Déclaration</div>
      <div class="nav-tab" data-tab="declarer" onclick="go('declarer')">➕<span>Déclarer un retour</span></div>
      <div class="nav-tab" data-tab="mes" onclick="go('mes')">📋<span>Mes fiches</span></div>
      <div class="side-group admin-only">Traitement</div>
      <div class="nav-tab admin-only" data-tab="reception" onclick="go('reception')">🏭<span>Réception dépôt</span></div>
      <div class="nav-tab admin-only" data-tab="reporting" onclick="go('reporting')">📊<span>Reporting</span></div>
      <div class="side-group admin-only">Fournisseurs</div>
      <div class="nav-tab admin-only" data-tab="dossiers" onclick="go('dossiers')">📦<span>Dossiers d'envoi</span></div>
      <div class="nav-tab admin-only" data-tab="fournisseurs" onclick="go('fournisseurs')">🏢<span>Fournisseurs</span></div>
      <div class="side-group admin-only">Catalogue</div>
      <div class="nav-tab admin-only" data-tab="articles" onclick="go('articles')">📚<span>Articles</span></div>
      <div class="side-group admin-only">Équipe</div>
      <div class="nav-tab admin-only" data-tab="commerciaux" onclick="go('commerciaux')">🧑‍💼<span>Commerciaux</span></div>
      <div class="nav-tab admin-only" data-tab="droits" onclick="go('droits')">👥<span>Droits</span></div>
    </nav>
  </aside>
  <div class="main-col">
    <div class="topbar2">
      <button class="icon-btn" onclick="toggleSidebar()" title="Replier/déplier le menu">☰</button>
      <div class="topbar-right">
        <span id="vbadge" class="muted"></span>
        <span id="qui" style="font-size:12px;color:var(--gold)"></span>
        <button class="btn btn-gray btn-sm" onclick="deconnexion()">Quitter</button>
      </div>
    </div>
    <div class="content-wrap" id="content"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- MODALE : nouveau dossier fournisseur -->
<div class="modal-bg" id="modalNouveauDossier">
  <div class="modal">
    <h3>📦 Nouveau dossier d'envoi</h3>
    <label>Fournisseur</label>
    <select id="nd-fournisseur" onchange="chargerCandidatsDossier()"></select>
    <div id="nd-candidats" style="margin-top:14px"></div>
    <div class="form-actions">
      <button class="btn btn-gray" onclick="fermerModal('modalNouveauDossier')">Annuler</button>
      <button class="btn btn-gold" onclick="creerDossier()">✅ Créer le dossier</button>
    </div>
  </div>
</div>

<div id="lb-overlay" onclick="if(event.target===this)lbClose()">
  <span id="lb-close" onclick="lbClose()">✕</span>
  <span id="lb-prev" class="lb-nav" onclick="lbNav(-1)">‹</span>
  <img id="lb-img" src="" alt="Photo">
  <span id="lb-next" class="lb-nav" onclick="lbNav(1)">›</span>
  <div id="lb-count"></div>
</div>

<a href="index.html" title="Menu AJCV" style="position:fixed;bottom:16px;right:16px;z-index:9999;width:44px;height:44px;border-radius:50%;background:rgba(30,41,66,.88);border:1px solid rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:20px;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.35)">🏠</a>

<script>
const API='https://ajcvbackend-production.up.railway.app';
const S={token:'',login:'',role:''};
function $(id){return document.getElementById(id)}
function esc(x){return String(x==null?'':x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(window._toastTO);window._toastTO=setTimeout(()=>t.classList.remove('show'),2800)}
function fermerModal(id){$(id).classList.remove('active')}
async function api(method,path,body){
  const o={method,headers:{'Authorization':'Bearer '+S.token}};
  if(body){o.headers['Content-Type']='application/json';o.body=JSON.stringify(body)}
  const r=await fetch(API+path,o);
  if(r.status===401){deconnexion();throw new Error('401')}
  return r.json();
}

// ── Thème clair/sombre ──
(function(){
  try{var t=localStorage.getItem('ajcvret_theme')||((window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark');document.documentElement.setAttribute('data-theme',t);}catch(e){}
  function ap(t){document.documentElement.setAttribute('data-theme',t);var b=$('theme-btn');if(b)b.textContent=(t==='light'?'🌙':'☀️');}
  function tg(){var c=document.documentElement.getAttribute('data-theme')==='light'?'light':'dark';var n=c==='light'?'dark':'light';try{localStorage.setItem('ajcvret_theme',n);}catch(_){}ap(n);}
  ap(document.documentElement.getAttribute('data-theme')||'dark');
  var b=$('theme-btn'); if(b) b.onclick=tg;
})();

// ── Connexion ──
async function seConnecter(){
  const err=$('lg-msg'); err.style.display='none';
  const login=$('lg-user').value.trim(), mdp=$('lg-pass').value;
  if(!login||!mdp){err.textContent='Identifiant et mot de passe requis';err.style.display='block';return}
  try{
    const r=await fetch(API+'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({login,mdp,app:'retours'})});
    const d=await r.json();
    if(!d.token){err.textContent=d.error||'Identifiants invalides';err.style.display='block';return}
    S.token=d.token;S.login=d.login||login;S.role=d.role||'';
    sessionStorage.setItem('ajcvret',JSON.stringify(S));
    demarrer();
  }catch(e){err.textContent='Erreur réseau';err.style.display='block'}
}
function deconnexion(){sessionStorage.removeItem('ajcvret');location.reload()}
function demarrer(){
  $('login').style.display='none';
  $('app').classList.add('on');
  if(window.innerWidth<=720) $('app').classList.add('collapsed');
  $('qui').textContent=S.login+' ('+S.role+')';
  fetch('version.json').then(r=>r.json()).then(v=>{$('vbadge').textContent='v'+v.version}).catch(()=>{});
  const estAdmin=['Admin','Depot'].includes(S.role);
  document.querySelectorAll('.admin-only').forEach(el=>{ el.style.display=estAdmin?'':'none'; });
  go('accueil');
}
function toggleSidebar(){ $('app').classList.toggle('collapsed'); }

// ── Navigation ──
const RENDERERS={accueil:renderAccueil,declarer:renderDeclarer,mes:renderMes,reception:renderReception,reporting:renderReporting,dossiers:renderDossiers,fournisseurs:renderFournisseurs,articles:renderArticles,commerciaux:renderCommerciaux,droits:renderDroits};
function go(tab){
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===tab));
  if(window.innerWidth<=720) $('app').classList.add('collapsed');
  $('content').innerHTML='<div class="loading"><div class="spin"></div></div>';
  (RENDERERS[tab]||renderAccueil)();
}

// ── Référentiels partagés (chargés une fois, réutilisés partout) ──
let _commerciaux=[], _fournisseurs=[], _clients=[];
async function chargerReferentiels(){
  const [c,f,cl]=await Promise.all([
    api('GET','/retours/commerciaux').catch(()=>({commerciaux:[]})),
    api('GET','/retours/fournisseurs').catch(()=>({fournisseurs:[]})),
    api('GET','/retours/clients').catch(()=>({clients:[]})),
  ]);
  _commerciaux=c.commerciaux||[]; _fournisseurs=f.fournisseurs||[]; _clients=cl.clients||[];
}

// ════════════════════════════════════════════════════════════════════════════
// ACCUEIL — vue d'ensemble
// ════════════════════════════════════════════════════════════════════════════
async function renderAccueil(){
  const estAdmin=['Admin','Depot'].includes(S.role);
  $('content').innerHTML=`
    <div class="card">
      <h3>👋 Bonjour ${esc(S.login)}</h3>
      <p class="muted">Déclare un retour, suis tes fiches, ${estAdmin?'et pilote le traitement et les remboursements fournisseurs.':'et suis leur traitement.'}</p>
    </div>
    <div id="acc-kpis"></div>`;
  await chargerReferentiels();
  if(!estAdmin){
    const d=await api('GET','/retours/mes').catch(()=>({fiches:[]}));
    const F=d.fiches||[];
    const enCours=F.filter(f=>!['livre','refuse'].includes(f.statut)).length;
    const zoneKpi=$('acc-kpis'); if(!zoneKpi) return; // page quittée pendant le chargement
    zoneKpi.innerHTML=`<div class="card"><div class="kpi-grid">
      ${kpiTuile(F.length,'Fiches déclarées')}${kpiTuile(enCours,'En cours','var(--blue)')}
    </div></div>`;
    return;
  }
  const [d,al]=await Promise.all([
    api('GET','/retours/reporting').catch(()=>({fiches:[]})),
    api('GET','/retours/dossiers-fournisseur').catch(()=>({dossiers:[]})),
  ]);
  const F=d.fiches||[]; const dossiers=al.dossiers||[];
  const enAttenteReception=F.filter(f=>(f.qte_recue||0)<f.qte&&!['refuse'].includes(f.statut)).length;
  const nonTransmis=F.filter(f=>f.recu_le&&!f.dossier_numero&&f.statut!=='refuse').length;
  const dossiersOuverts=dossiers.filter(d=>d.statut!=='clos'&&d.statut!=='rembourse_total').length;
  const montantAttendu=dossiers.filter(d=>['rembourse_partiel','rembourse_total'].includes(d.statut)).reduce((s,d)=>s+(d.montant_rembourse||0),0);
  const zoneKpi=$('acc-kpis'); if(!zoneKpi) return; // page quittée pendant le chargement
  zoneKpi.innerHTML=`<div class="card"><div class="kpi-grid">
    ${kpiTuile(F.length,'Fiches (total)')}
    ${kpiTuile(enAttenteReception,'En attente dépôt',enAttenteReception?'var(--orange)':'var(--green)')}
    ${kpiTuile(nonTransmis,'Reçues, pas encore transmises',nonTransmis?'var(--red)':'var(--green)')}
    ${kpiTuile(dossiersOuverts,'Dossiers en cours','var(--blue)')}
    ${kpiTuile(montantAttendu.toFixed(0)+' €','Remboursé à date','var(--gold)')}
  </div></div>
  ${nonTransmis?`<div class="card" style="border-color:var(--red)">
    <h3 style="color:var(--red)">⚠️ ${nonTransmis} fiche(s) reçue(s) au dépôt jamais transmise(s) à un fournisseur</h3>
    <p class="muted" style="margin-bottom:10px">Elles sont prêtes à être regroupées dans un dossier d'envoi.</p>
    <button class="btn btn-purple" onclick="go('dossiers')">📦 Aller aux dossiers fournisseurs</button>
  </div>`:''}`;
}
function kpiTuile(v,l,c){return `<div class="kpi"><div class="kpi-v" style="color:${c||'var(--text)'}">${v}</div><div class="kpi-l">${l}</div></div>`;}

// ════════════════════════════════════════════════════════════════════════════
// DÉCLARER UN RETOUR (panier multi-articles, regroupement auto par article)
// ════════════════════════════════════════════════════════════════════════════
const MOTIFS={fuite:'Fuite',ne_s_allume_pas:"Ne s'allume pas",gout:'Goût',dlc:'DLC',casse:'Casse',autre:'Autre'};
const STATUTS={declare:['Déclaré','#E8A63C'],recu_depot:['Reçu dépôt','#4E8BF0'],remplace:['Remplacé','#8B6CF2'],livre:['Livré','#33C481'],refuse:['Refusé','#F0555A']};
let P={lignes:[]};
async function renderDeclarer(){
  await chargerReferentiels();
  P={lignes:P.lignes.length?P.lignes:[]};
  $('content').innerHTML=`
    <div class="card">
      <h3>➕ Déclarer un retour</h3>
      <div class="form-grid">
        <div><label>Commercial (qui a récupéré le produit)</label><select id="rc-commercial"><option value="">— Commercial —</option>${_commerciaux.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('')}</select></div>
        <div><label>Client</label><input id="rc-client" placeholder="Nom du client" list="rc-clients"><datalist id="rc-clients">${_clients.map(c=>`<option value="${esc(c)}">`).join('')}</datalist></div>
      </div>
      <div id="rc-lignes" style="margin-top:14px"></div>
      <button class="btn btn-gray" onclick="ajouterLigne()">+ Ajouter un article</button>

  if(!P.lignes.length) ajouterLigne(); else renderLignes();

function ajouterLigne(){P.lignes.push({article:null,qte:1,motif:'fuite',commentaire:'',facture_origine:'',photos:[],up:0});renderLignes()}
function retirerLigne(i){P.lignes.splice(i,1);renderLignes()}
function renderLignes(){
  const z=$('rc-lignes'); if(!z) return;
  z.innerHTML=P.lignes.map((l,i)=>`
  <div class="ligne-art">
    <div class="flex-between" style="margin-bottom:8px"><b>Article ${i+1}</b><button class="btn btn-red btn-sm" onclick="retirerLigne(${i})">✕</button></div>
    ${l.article?`<div style="margin-bottom:8px">✅ <b>${esc(l.article.ref_odoo)}</b> — ${esc(l.article.libelle)} <button class="btn btn-gray btn-sm" onclick="P.lignes[${i}].article=null;renderLignes()">changer</button></div>`
      :`<input placeholder="Article : libellé, réf ou douchette…" style="margin-bottom:6px" oninput="chercherArt(${i},this.value)"><div id="art-res-${i}"></div>`}
    <div class="form-grid" style="margin-bottom:8px">
      <input type="number" min="1" value="${l.qte}" onchange="P.lignes[${i}].qte=parseInt(this.value)||1" placeholder="Quantité">
      <select onchange="P.lignes[${i}].motif=this.value">${Object.entries(MOTIFS).map(([k,v])=>`<option value="${k}" ${l.motif===k?'selected':''}>${v}</option>`).join('')}</select>
    </div>
    <input placeholder="Facture d'origine (optionnel)" value="${esc(l.facture_origine)}" style="margin-bottom:8px" onchange="P.lignes[${i}].facture_origine=this.value">
    <input placeholder="Commentaire (optionnel)" value="${esc(l.commentaire)}" style="margin-bottom:8px" onchange="P.lignes[${i}].commentaire=this.value">
    <label class="lbl-file">📷 Photo du produit<input type="file" accept="image/*" capture="environment" onchange="photoRetour(${i},this)"></label>
    <span style="margin-left:8px">${l.photos.map(()=>'<span class="pill pill-ok" style="margin-right:4px">✓</span>').join('')}${l.up?'<span class="muted">⏳ envoi…</span>':''}</span>
    <span class="muted" style="margin-left:6px">${l.photos.length} photo(s) en sécurité</span>
  </div>`).join('')||'<p class="muted">Ajoute au moins un article.</p>';
}
let _ta=null;
function chercherArt(i,q){clearTimeout(_ta);_ta=setTimeout(async()=>{
  if(!q||q.length<2){$('art-res-'+i).innerHTML='';return}
  const d=await api('GET','/retours/articles?q='+encodeURIComponent(q));
  $('art-res-'+i).innerHTML=(d.articles||[]).slice(0,6).map(a=>`<div class="art-res-item" onclick='choisirArt(${i},${JSON.stringify({id:a.id,ref_odoo:a.ref_odoo,libelle:a.libelle}).replace(/'/g,"&#39;")})'><b>${esc(a.ref_odoo)}</b> — ${esc(a.libelle)}</div>`).join('')||'<span class="muted">Aucun article.</span>';
},250)}
// Regroupement : si l'article est déjà présent sur une autre ligne, on cumule la quantité
// au lieu de créer une seconde ligne pour le même article (demande explicite de Laurent).
function choisirArt(i,a){
  const autre=P.lignes.findIndex((l,idx)=>idx!==i&&l.article&&l.article.id===a.id);
  if(autre>-1){
    P.lignes[autre].qte=(parseInt(P.lignes[autre].qte)||1)+(parseInt(P.lignes[i].qte)||1);
    P.lignes[autre].photos=P.lignes[autre].photos.concat(P.lignes[i].photos||[]);
    P.lignes.splice(i,1);
    toast('🔗 Article déjà présent — quantités regroupées');
  }else{
    P.lignes[i].article=a;
  }
  renderLignes();
}
function compresser(file,maxDim,q){return new Promise((res,rej)=>{
  const img=new Image();const u=URL.createObjectURL(file);
  img.onload=()=>{const r=Math.min(1,maxDim/Math.max(img.width,img.height));
    const c=document.createElement('canvas');c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',q))};
  img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('illisible'))};img.src=u})}
async function photoRetour(i,input){
  const f=input.files&&input.files[0];input.value='';if(!f)return;
  P.lignes[i].up=1;renderLignes();
  try{
    const b64=await compresser(f,1600,0.8);
    const r=await api('POST','/retours/photo',{photo:b64});
    if(r.error){toast('❌ '+r.error)}else{P.lignes[i].photos.push(r.path)}
  }catch(e){toast('❌ Photo illisible ou réseau')}
  P.lignes[i].up=0;renderLignes();
}
async function envoyerRetour(){
  const client=$('rc-client').value.trim();
  if(!client){toast('Nom du client requis');return}
  if(!P.lignes.length){toast('Ajoute au moins un article');return}
  const selC=$('rc-commercial');const commercial_nom=selC?selC.value:'';
  if(selC&&selC.options.length>1&&!commercial_nom){toast('Choisis le commercial');return}
  for(const l of P.lignes){
    if(!l.article){toast('Un article n’est pas choisi');return}
    if(!l.photos.length){toast('Au moins une photo par article');return}
  }
  const b=$('rc-env');b.disabled=true;$('rc-msg').textContent='Envoi…';
  const r=await api('POST','/retours',{client_nom:client,commercial_nom,lignes:P.lignes.map(l=>({article_id:l.article.id,qte:l.qte,motif:l.motif,commentaire:l.commentaire,facture_origine:l.facture_origine,photos:l.photos}))});
  b.disabled=false;
  if(r.error){$('rc-msg').textContent='❌ '+r.error;return}
  $('rc-msg').textContent='';toast('✅ '+r.numeros.join(', ')+' créé(s)');
  P={lignes:[]};go('mes');
}

async function renderReception(){
  $('content').innerHTML=`<div class="card"><h3>🏭 Réception dépôt <span class="muted" id="rd-count"></span></h3><p class="muted" style="margin-bottom:10px">Produits défectueux en attente d'arrivée au dépôt. ✅ = reçu · ❌ = refusé (motif obligatoire).</p><div id="rd-liste"><div class="loading"><div class="spin"></div></div></div></div>`;
  chargerReception();
}
async function chargerReception(){
  const d=await api('GET','/retours/mes');
  if(d.error){$('rd-liste').innerHTML='<p class="err" style="display:block">'+esc(d.error)+'</p>';return}
  const F=(d.fiches||[]).filter(f=>((parseInt(f.qte_recue)||0)<f.qte)&&['declare','remplace','recu_depot'].includes(f.statut));
  $('rd-count').textContent=F.length?'· '+F.length+' en attente':'';
  $('rd-liste').innerHTML=F.length?'<div class="table-wrap"><table><thead><tr><th>N°</th><th>Date</th><th>Client</th><th>Article</th><th>Qté</th><th>Reçu</th><th>Motif</th><th>Commercial</th><th></th></tr></thead><tbody>'+
    F.map(f=>`<tr><td><b style="cursor:pointer;text-decoration:underline" onclick="ouvrirDetail('${f.id}')">${esc(f.numero)}</b></td><td class="muted">${new Date(f.created_at).toLocaleDateString('fr-FR')}</td><td>${esc(f.client_nom)}</td><td>${f.article?esc(f.article.ref_odoo):'—'}</td><td>${f.qte}</td><td><b>${parseInt(f.qte_recue)||0}/${f.qte}</b></td><td>${MOTIFS[f.motif]||f.motif}</td><td class="muted">${esc(f.commercial_nom||f.commercial)}</td>
      <td style="white-space:nowrap"><button class="btn btn-green btn-sm" onclick="recevoirFiche('${f.id}','${esc(f.numero)}',${f.qte-(parseInt(f.qte_recue)||0)})">✅ Reçu</button>
      <button class="btn btn-red btn-sm" onclick="refuserFiche('${f.id}','${esc(f.numero)}')">❌ Refuser</button></td></tr>`).join('')+
    '</tbody></table></div>':'<p class="muted">Rien en attente — tout est reçu. ✅</p>';
}
async function recevoirFiche(id,num,restant){
  const q=prompt('Quantité reçue pour '+num+' ('+restant+' attendu(s)) :',restant);
  if(q===null)return; const n=parseInt(q); if(!n||n<1){toast('Quantité invalide');return}
  const r=await api('PATCH','/retours/'+id+'/recevoir',{qte:n});
  if(r.error){toast('❌ '+r.error);return}
  toast('✅ '+num+' reçu au dépôt');chargerReception();
}
async function refuserFiche(id,num){
  const m=prompt('Motif du refus de '+num+' (obligatoire) :');
  if(m===null)return; if(!m.trim()){toast('Motif obligatoire');return}
  const r=await api('PATCH','/retours/'+id+'/refuser',{motif_refus:m.trim()});
  if(r.error){toast('❌ '+r.error);return}
  toast('❌ '+num+' refusé');chargerReception();
}
async function livrerFiche(id,num){
  const r=await api('PATCH','/retours/'+id+'/livrer',{});
  if(r.error){toast('❌ '+r.error);return}
  toast('🚚 '+num+' → Livré');go('mes');
}

// ════════════════════════════════════════════════════════════════════════════
let _rp=[], _rpSous='article';
async function renderReporting(){
  $('content').innerHTML=`
    <div class="card">
      <div class="flex-between" style="margin-bottom:10px">
        <h3 style="margin:0">📊 Reporting défectueux</h3>
        <button class="btn btn-green btn-sm" onclick="exportReporting()">⬇️ Export CSV</button>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <input type="date" id="rp-deb" style="max-width:160px" onchange="chargerReporting()">
        <input type="date" id="rp-fin" style="max-width:160px" onchange="chargerReporting()">
        <select id="rp-st" style="max-width:170px" onchange="chargerReporting()">
          <option value="">Tous statuts</option><option value="declare">Déclaré</option><option value="recu_depot">Reçu dépôt</option>
          <option value="remplace">Remplacé</option><option value="livre">Livré</option><option value="refuse">Refusé</option>
        </select>
        <input id="rp-q" placeholder="Filtrer client / commercial / facture / n° RET…" style="flex:1;min-width:200px" oninput="renderReportingCorps()">
      </div>
    </div>
    <div class="card">
      <div style="display:flex;gap:8px;margin-bottom:14px">
        <button class="subtab ${_rpSous==='article'?'active':''}" onclick="_rpSous='article';renderReportingCorps()">Par article</button>
        <button class="subtab ${_rpSous==='client'?'active':''}" onclick="_rpSous='client';renderReportingCorps()">Par client</button>
        <button class="subtab ${_rpSous==='commercial'?'active':''}" onclick="_rpSous='commercial';renderReportingCorps()">Par commercial</button>
      </div>
      <div id="rp-synthese"></div>
      <div id="rp-detail" style="margin-top:12px"></div>
    </div>`;
  const d=new Date();$('rp-fin').value=d.toISOString().split('T')[0];d.setDate(d.getDate()-30);$('rp-deb').value=d.toISOString().split('T')[0];
  chargerReporting();
}
async function chargerReporting(){
  const p=new URLSearchParams();
  if($('rp-deb').value)p.set('debut',$('rp-deb').value);
  if($('rp-fin').value)p.set('fin',$('rp-fin').value);
  if($('rp-st').value)p.set('statut',$('rp-st').value);
  const d=await api('GET','/retours/reporting?'+p.toString());
  if(d.error){$('rp-synthese').innerHTML='<p class="err" style="display:block">'+esc(d.error)+'</p>';return}
  _rp=d.fiches||[];
  renderReportingCorps();
}
function _rpFiltre(){
  const q=($('rp-q')?.value||'').toLowerCase();
  return q?_rp.filter(f=>[f.article,f.ref,f.client,f.commercial,f.numero,f.facture_origine,f.facture_remplacement,f.fournisseur].join(' ').toLowerCase().includes(q)):_rp;
}
function renderReportingCorps(){
  document.querySelectorAll('.subtab').forEach(b=>b.classList.toggle('active',b.textContent.toLowerCase().includes(_rpSous)));
  const F=_rpFiltre();
  if(!F.length){$('rp-synthese').innerHTML='<p class="muted">Aucune fiche sur la période.</p>';$('rp-detail').innerHTML='';return}
  const cle=_rpSous==='article'?f=>f.ref||f.article:_rpSous==='client'?f=>f.client:f=>f.commercial;
  const libelle=_rpSous==='article'?f=>(f.ref?f.ref+' — ':'')+f.article:_rpSous==='commercial'?f=>f.commercial:f=>f.client;
  const agg={};let qT=0,cT=0,transmisT=0;
  F.forEach(f=>{const k=cle(f)||'—';agg[k]=agg[k]||{lib:libelle(f)||'—',fiches:0,qte:0,cout:0,recu:0,transmis:0};
    agg[k].fiches++;agg[k].qte+=f.qte;qT+=f.qte;agg[k].recu+=(f.qte_recue||0);
    if(f.cout!=null){agg[k].cout+=f.cout;cT+=f.cout}
    if(f.dossier_transmis){agg[k].transmis++;transmisT++}});
  const A=Object.values(agg).sort((a,b)=>b.qte-a.qte);
  const tuile=(v,l,c)=>`<div class="kpi"><div class="kpi-v" style="color:${c||'var(--text)'}">${v}</div><div class="kpi-l">${l}</div></div>`;
  $('rp-synthese').innerHTML=`
  <div class="kpi-grid">
    ${tuile(F.length,'Fiches')}${tuile(qT,'Produits déf.','var(--red)')}${tuile(cT.toFixed(0)+' €','Coût gestes','var(--gold)')}
    ${tuile(transmisT+'/'+F.length,'Transmises fournisseur',transmisT<F.length?'var(--orange)':'var(--green)')}
  </div>
  <div class="table-wrap"><table><thead><tr><th>${_rpSous==='article'?'Article':_rpSous==='client'?'Client':'Commercial'}</th><th>Fiches</th><th>Qté déf.</th><th>Reçu dépôt</th><th>Transmis fourn.</th><th>Coût</th></tr></thead><tbody>
    ${A.map(a=>`<tr><td><b>${esc(a.lib)}</b></td><td>${a.fiches}</td><td><b>${a.qte}</b></td><td>${a.recu}/${a.qte}${a.recu<a.qte?' <span class="pill pill-no">incomplet</span>':' <span class="pill pill-ok">✓</span>'}</td><td>${a.transmis}/${a.fiches}${a.transmis<a.fiches?' <span class="pill pill-wait">à transmettre</span>':' <span class="pill pill-ok">✓</span>'}</td><td>${a.cout?a.cout.toFixed(2)+' €':'—'}</td></tr>`).join('')}
  </tbody></table></div>`;
  $('rp-detail').innerHTML=`<details><summary class="muted" style="cursor:pointer">Détail des ${F.length} fiches</summary>
    <div class="table-wrap" style="margin-top:8px"><table><thead><tr><th>N°</th><th>Date</th><th>Commercial</th><th>Client</th><th>Article</th><th>Fournisseur</th><th>Qté</th><th>Statut</th><th>Envoi fourn.</th></tr></thead><tbody>
    ${F.map(f=>`<tr><td>${esc(f.numero)}</td><td class="muted">${new Date(f.date).toLocaleDateString('fr-FR')}</td><td>${esc(f.commercial)}</td><td>${esc(f.client)}</td><td>${esc(f.ref)} <span class="muted">${esc(f.article)}</span></td><td class="muted">${esc(f.fournisseur||'—')}</td><td>${f.qte}</td><td>${(STATUTS[f.statut]||[f.statut])[0]}</td><td>${f.dossier_numero?'<span class="pill pill-ok">'+esc(f.dossier_numero)+'</span>':(f.recu_le?'<span class="pill pill-wait">à transmettre</span>':'<span class="muted">—</span>')}</td></tr>`).join('')}
    </tbody></table></div></details>`;
}
function exportReporting(){
  const F=_rpFiltre();if(!F.length){toast('Rien à exporter');return}
  const cols=['numero','date','recu_le','date_livraison_prevue','date_livraison_reelle','commercial','client','ref','article','fournisseur','qte','qte_recue','motif','statut','facture_origine','facture_remplacement','cout','dossier_numero'];
  const cell=v=>{if(v==null)return'';const s=String(v).replace(/"/g,'""');return /[;"\n]/.test(s)?'"'+s+'"':s};
  const csv='﻿'+cols.join(';')+'\n'+F.map(f=>cols.map(c=>cell(f[c])).join(';')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download='retours_defectueux_'+new Date().toISOString().split('T')[0]+'.csv';a.click();URL.revokeObjectURL(a.href);
  toast('⬇️ Export : '+F.length+' fiches');
}

const STDOSS={brouillon:['Brouillon','#9BA1AC'],envoye:['Envoyé','#4E8BF0'],rembourse_partiel:['Remboursé partiel','#E39A3D'],rembourse_total:['Remboursé total','#33C481'],clos:['Clos','#6E7480']};

    </div>

async function chargerDossiers(){
  const d=await api('GET','/retours/dossiers-fournisseur');
  if(d.error){$('doss-liste').innerHTML='<p class="err" style="display:block">'+esc(d.error)+'</p>';return}
  const L=d.dossiers||[];

async function ajouterArticle(){
  const g=x=>$(x).value.trim();
  const ref=g('na-ref'),lib=g('na-lib');
  if(!ref||!lib){toast('Référence et libellé obligatoires');return}
  const fournId=$('na-fourn').value;
  const fournNom=fournId?(_fournisseurs.find(f=>String(f.id)===fournId)||{}).nom:'';
  const r=await api('POST','/retours/articles/import',{lignes:[{ref_odoo:ref,libelle:lib,code_barre:g('na-cb'),categorie:g('na-cat'),prix_achat:g('na-px'),fournisseur:fournNom}]});
  if(r.error){toast('❌ '+r.error);return}
  toast(r.crees?'✅ '+ref+' créé':'🔁 '+ref+' mis à jour');
  ['na-ref','na-lib','na-cb','na-cat','na-px'].forEach(x=>$(x).value='');
  $('na-fourn').value='';
  rechercher($('rech').value);
}
function importerCSV(input){
  const f=input.files&&input.files[0]; if(!f)return;
  const rd=new FileReader();
  rd.onload=async()=>{
    const txt=String(rd.result||'');
    const lignesBrutes=txt.split(/\r?\n/).filter(l=>l.trim());
    if(lignesBrutes.length<2){toast('CSV vide');return}
    const sep=lignesBrutes[0].includes(';')?';':',';
    const heads=lignesBrutes[0].split(sep).map(h=>h.trim().toLowerCase());
    const lignes=lignesBrutes.slice(1).map(l=>{const c=l.split(sep);const o={};heads.forEach((h,i)=>o[h]=(c[i]||'').trim());return o;});
    $('imp-res').textContent='Import de '+lignes.length+' lignes…';
    try{
      const r=await api('POST','/retours/articles/import',{lignes});
      if(r.error){$('imp-res').textContent='❌ '+r.error;return}
      $('imp-res').innerHTML='<span class="pill pill-ok">'+r.crees+' créés</span> <span class="pill pill-ok">'+r.maj+' mis à jour</span>'+(r.erreurs?' <span class="pill pill-no">'+r.erreurs+' en erreur</span>':'');
      rechercher($('rech').value);
    }catch(e){$('imp-res').textContent='❌ Erreur réseau'}
  };
  rd.readAsText(f,'utf-8');input.value='';
}
let _t=null;
function rechDebounce(){clearTimeout(_t);_t=setTimeout(()=>rechercher($('rech').value),250)}
async function rechercher(q){
  try{
    const d=await api('GET','/retours/articles?q='+encodeURIComponent(q||''));
    if(d.error){$('rech-res').innerHTML='<p class="err" style="display:block">'+esc(d.error)+'</p>';return}
    const A=d.articles||[];
    $('rech-res').innerHTML=A.length?'<div class="table-wrap"><table><thead><tr><th>Réf.</th><th>Libellé</th><th>Code-barres</th><th>Catégorie</th><th>PA</th><th>Fournisseur</th></tr></thead><tbody>'+
      A.map(a=>'<tr><td><b>'+esc(a.ref_odoo)+'</b></td><td>'+esc(a.libelle)+'</td><td>'+esc(a.code_barre||'—')+'</td><td>'+esc(a.categorie||'—')+'</td><td>'+(a.prix_achat!=null?Number(a.prix_achat).toFixed(2)+' €':'—')+'</td><td>'+esc(a.fournisseurs?a.fournisseurs.nom:'—')+'</td></tr>').join('')+
      '</tbody></table></div>':'<p class="muted">Aucun article'+(q?' pour « '+esc(q)+' »':' — importe ton CSV ci-dessus')+'.</p>';
  }catch(e){}
}

      <label class="lbl-file">📷 Ajouter une photo<input type="file" accept="image/*" capture="environment" onchange="ajouterPhotoFiche('${f.id}',this)"></label>
      ${adm?`<select class="inline-sel" id="cor-st" style="padding:7px">${Object.entries(STATUTS).map(([k,v])=>`<option value="${k}" ${f.statut===k?'selected':''}>${v[0]}</option>`).join('')}</select>
      <input class="inline-sel" id="cor-qr" type="number" min="0" max="${f.qte}" value="${parseInt(f.qte_recue)||0}" style="max-width:70px" title="Quantité reçue">
      <span class="muted">/${f.qte} reçu</span>
      <button class="btn btn-gray btn-sm" onclick="corrigerFiche('${f.id}','${esc(f.numero)}')">💾 Corriger</button>
      <button class="btn btn-gray btn-sm" onclick="modifierFiche('${f.id}')">✏️ Modifier la fiche</button>`:''}
    </div>`;
  }
}
async function modifierFiche(id){
  const d=await api('GET','/retours/'+id+'/detail');
  if(d.error){toast('❌ '+d.error);return}
  const f=d.fiche;
  const zone=document.getElementById('det-outils');if(!zone)return;
  zone.innerHTML=`<div style="border:1px solid var(--gold);border-radius:10px;padding:12px;margin-bottom:12px">
    <b>✏️ Modification de ${esc(f.numero)}</b>
    <div class="form-grid" style="margin-top:8px">
      <input id="md-client" value="${esc(f.client_nom)}" placeholder="Client" list="rc-clients">
      <select id="md-com">${'<option value="">— Commercial —</option>'+_commerciaux.map(n=>`<option ${f.commercial_nom===n?'selected':''}>${esc(n)}</option>`).join('')}</select>
      <input id="md-qte" type="number" min="1" value="${f.qte}" placeholder="Qté">
      <select id="md-motif">${Object.entries(MOTIFS).map(([k,v])=>`<option value="${k}" ${f.motif===k?'selected':''}>${v}</option>`).join('')}</select>
      <input id="md-fo" value="${esc(f.facture_origine||'')}" placeholder="Facture d'origine">
      <input id="md-fr" value="${esc(f.facture_remplacement||'')}" placeholder="Facture de remplacement">
      <input id="md-dp" type="date" value="${f.date_livraison_prevue||''}">
      <input id="md-comm" value="${esc(f.commentaire||'')}" placeholder="Commentaire">
    </div>
    <div class="form-actions" style="justify-content:flex-start">
      <button class="btn btn-gold" onclick="enregistrerModif('${f.id}','${esc(f.numero)}')">💾 Enregistrer</button>
      <button class="btn btn-gray" onclick="document.getElementById('retDet').remove();ouvrirDetail('${f.id}')">Annuler</button>
    </div></div>`;
}
async function enregistrerModif(id,num){
  const g=x=>document.getElementById(x).value;
  const r=await api('PATCH','/retours/'+id+'/modifier',{client_nom:g('md-client'),commercial_nom:g('md-com'),qte:parseInt(g('md-qte')),motif:g('md-motif'),facture_origine:g('md-fo'),facture_remplacement:g('md-fr'),date_livraison_prevue:g('md-dp'),commentaire:g('md-comm')});
  if(r.error){toast('❌ '+r.error);return}
  toast(r.rien?'Aucun changement':'💾 '+num+' modifié');
  document.getElementById('retDet').remove();ouvrirDetail(id);
}
async function corrigerFiche(id,num){
  const r=await api('PATCH','/retours/'+id+'/corriger',{statut:document.getElementById('cor-st').value,qte_recue:parseInt(document.getElementById('cor-qr').value)});
  if(r.error){toast('❌ '+r.error);return}
  toast('💾 '+num+' corrigé');document.getElementById('retDet').remove();ouvrirDetail(id);
}
async function ajouterPhotoFiche(id,input){
  const file=input.files&&input.files[0];input.value='';if(!file)return;
  toast('⏳ Envoi de la photo…');
  try{
    const b64=await compresser(file,1600,0.8);
    const up=await api('POST','/retours/photo',{photo:b64});
    if(up.error){toast('❌ '+up.error);return}
    const r=await api('POST','/retours/'+id+'/photos',{photos:[up.path]});
    if(r.error){toast('❌ '+r.error);return}
    toast('📷 Photo ajoutée');document.getElementById('retDet').remove();ouvrirDetail(id);
  }catch(e){toast('❌ Photo illisible ou réseau')}
}
async function saisirFacture(id,num){
  const fac=prompt('N° de facture de remplacement pour '+num+' :');if(fac===null||!fac.trim())return;
  const dt=prompt('Date de livraison prévue (AAAA-MM-JJ) :',new Date().toISOString().split('T')[0]);if(dt===null||!dt.trim())return;
  const r=await api('PATCH','/retours/'+id+'/facture',{facture_remplacement:fac.trim(),date_livraison_prevue:dt.trim()});
  if(r.error){toast('❌ '+r.error);return}
  toast('✅ '+num+' → Remplacé');go('mes');
}

// ── Visionneuse photos plein écran ──
let _lb={urls:[],i:0};
function lbOpen(urls,i){_lb={urls,i:i||0};$('lb-overlay').classList.add('open');lbMaj();document.addEventListener('keydown',lbClavier)}
function lbClose(){$('lb-overlay').classList.remove('open');document.removeEventListener('keydown',lbClavier)}
function lbNav(d){const n=_lb.urls.length;if(!n)return;_lb.i=(_lb.i+d+n)%n;lbMaj()}
function lbClavier(e){if(e.key==='Escape')lbClose();if(e.key==='ArrowLeft')lbNav(-1);if(e.key==='ArrowRight')lbNav(1)}
function lbMaj(){
  $('lb-img').src=_lb.urls[_lb.i];
  $('lb-count').textContent=(_lb.i+1)+' / '+_lb.urls.length;
  const un=_lb.urls.length<2;
  $('lb-prev').style.display=un?'none':'';$('lb-next').style.display=un?'none':'';
}

// ── Boot ──
(function(){
  try{const s=JSON.parse(sessionStorage.getItem('ajcvret')||'null');if(s&&s.token){Object.assign(S,s);demarrer();return}}catch(_){}
})();
</script>
