<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🌿 Préparateur CBD — AJCV</title>
<script>
  // Tuile « Préparateur CBD » : ouvre TOUJOURS la console en vue préparateur.
  // Fichier dédié → cette tuile ne peut jamais retomber sur la console admin,
  // même si le menu a oublié le paramètre ?vue=preparateur.
  (function(){
    try{ var t=localStorage.getItem('ajcv_theme'); if(t) document.documentElement.setAttribute('data-theme', t); }catch(_){}
    location.replace('admin_production.html?vue=preparateur' + (location.hash || ''));
  })();
</script>
</head>
<body style="margin:0;height:100vh;display:flex;align-items:center;justify-content:center;background:#0F1724;color:#8B9EC7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <div style="text-align:center">
    <div style="font-size:42px;margin-bottom:10px">🌿</div>
    <div>Ouverture de l'espace Préparateur…</div>
  </div>
</body>
</html>
